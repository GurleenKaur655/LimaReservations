<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Application Error</title>
    <th:block th:replace="~{partial :: bootstrap}"/>
</head>
<body>
<header>
    <nav th:replace="~{nav :: navbar}"></nav>
</header>
<main class="flex-grow-1 d-flex align-items-center justify-content-center text-center px-3">
    <div>
        <h1 style="font-family: 'Iosevka Charon Mono', monospace;
                   font-size: clamp(6rem, 22vw, 11rem);
                   font-weight: 900;
                   line-height: 1;
                   background: linear-gradient(to bottom, #5d4037 0%, #9c7e41 50%, #4e342e 100%);
                   -webkit-background-clip: text;
                   -webkit-text-fill-color: transparent;">
            500
        </h1>

        <hr style="border: 2px solid #6B7C3A; width: 80px; margin: 1rem auto;">

        <h2 style="font-family: 'Iosevka Charon Mono', monospace;
                   font-weight: 800;
                   color: #6B7C3A;
                   font-size: 1.8rem;">
            The kitchen is having a moment
        </h2>

        <!--/*@thymesVar id="message" type="java.lang.String"*/-->
        <p class="mt-3"
           style="font-family: 'Iosevka Charon Mono', monospace; color: #5d4037;"
           th:text="${message} ?: 'Something went wrong on our end.'"></p>

        <p class="small text-muted">
            Give it a minute and try again. If this persists, please contact support.
        </p>
    </div>
</main>
</body>
</html>
