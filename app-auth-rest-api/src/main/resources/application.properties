spring.application.name=NBCC-Auth

spring.datasource.url=jdbc:mysql://localhost:3306/restaurant
spring.datasource.username=devJPA
spring.datasource.password=NBCC1234!

spring.jpa.hibernate.ddl-auto=update

server.port=8082

logging.level.root=INFO
logging.level.nbcc = debug
logging.file.name=logs/auth-rest-api.log

jwt.issuer=NBCC
