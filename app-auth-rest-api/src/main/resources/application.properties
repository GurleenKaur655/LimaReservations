spring.application.name=NBCC-Auth

spring.datasource.url=jdbc:mysql://localhost:3306/restaurant
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

server.port=8082

logging.level.root=INFO
logging.level.nbcc = debug
logging.file.name=logs/auth-rest-api.log

jwt.issuer=NBCC
jwt.timeout=3600

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=nbcc
spring.mail.password=nbcc
spring.mail.properties.mail.smtp.auth=false

email.from=noreply@nbcc.ca

# Key locations
jwt.private-key=${JWT_PRIVATE_KEY}
jwt.public-key=${JWT_PUBLIC_KEY}