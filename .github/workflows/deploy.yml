name: Build and deploy to Azure

on:
  push:
    branches: [main]

env:
  REGISTRY: gurleenresto2026.azurecr.io
  RESOURCE_GROUP: my-rg

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: auth-api
            module: app-auth-rest-api
            port: 8082
          - app: restaurant-api
            module: app-restaurant-rest-api
            port: 8081
          - app: app-web
            module: app-web
            port: 8080

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ matrix.app }}:${{ github.sha }}
          docker build --build-arg MODULE=${{ matrix.module }} --build-arg PORT=${{ matrix.port }} -t $IMAGE .
          docker push $IMAGE

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Container Apps
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az containerapp update --name ${{ matrix.app }} --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.REGISTRY }}/${{ matrix.app }}:${{ github.sha }}