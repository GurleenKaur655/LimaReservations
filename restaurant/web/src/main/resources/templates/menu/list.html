<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{partial :: bootstrap}"/>
    <meta charset="UTF-8">
    <title>Menus</title>
</head>
<body>

<header>
    <nav th:replace="~{nav :: navbar}"></nav>
</header>

<div class="container mt-4">
    <main role="main" class="pb-3">


        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="mb-0" style="font-size: 1.8rem; font-weight: 700;">
                Menus
            </h4>

            <a th:if="${viewModel.canAdd}"
               th:href="@{/menu/create}"
               class="btn btn-success btn-sm">
                <strong>+</strong> Add Menu
            </a>
        </div>


        <p th:if="${viewModel.message}"
           th:text="${viewModel.message}"
           class="alert alert-warning"></p>


        <div th:unless="${viewModel.isEmpty()}">
            <div class="card shadow-sm">
                <div class="card-body p-0">
                    <div class="table-responsive">

                        <table class="table table-hover table-striped mb-0">
                            <thead class="table-dark">
                            <tr>
                                <th>Name</th>
                                <th style="width: 180px;">Actions</th>
                            </tr>
                            </thead>

                            <tbody>
                            <tr th:each="menu : ${viewModel.menus}" class="align-middle">


                                <td>
                                    <a class="text-dark text-decoration-none fw-bold"
                                       th:href="@{/menu/{id}(id=${menu.id})}"
                                       th:text="${menu.name}">
                                    </a>
                                </td>


                                <td>
                                    <div class="btn-group btn-group-sm">

                                        <a th:href="@{/menu/{id}(id=${menu.id})}"
                                           class="btn btn-outline-primary">
                                            View
                                        </a>

                                        <a th:if="${viewModel.canEdit}"
                                           th:href="@{/menu/edit/{id}(id=${menu.id})}"
                                           class="btn btn-outline-warning">
                                            ✏️ Edit
                                        </a>

                                        <a th:if="${viewModel.canDelete}"
                                           th:href="@{/menu/delete/{id}(id=${menu.id})}"
                                           class="btn btn-outline-danger">
                                            🗑️ Delete
                                        </a>

                                    </div>
                                </td>

                            </tr>
                            </tbody>

                        </table>

                    </div>
                </div>
            </div>
        </div>


        <div th:if="${viewModel.isEmpty()}">
            <div class="card shadow-sm">
                <div class="card-body text-center py-5">

                    <div class="text-muted">
                        <div class="display-1 mb-3">🍽️</div>

                        <h5 style="font-family: 'Iosevka Charon Mono', monospace; font-weight: 700;">
                            No Menus Found
                        </h5>

                        <p class="mb-3">Create your first menu</p>

                        <a th:if="${viewModel.canAdd}"
                           th:href="@{/menu/create}"
                           class="btn btn-primary">
                            <strong>+</strong> Add Menu
                        </a>
                    </div>

                </div>
            </div>
        </div>

    </main>
</div>

</body>
</html>
