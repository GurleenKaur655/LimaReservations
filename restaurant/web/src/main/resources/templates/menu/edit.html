<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Menu</title>
    <th:block th:replace="~{partial :: bootstrap}"/>
</head>

<body>

<header>
    <nav th:replace="~{nav :: navbar}"></nav>
</header>

<div class="container mt-4">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 style="font-weight: 700; color: #1a1a1a;">Edit Menu</h2>

        <a th:href="@{/menu}" class="btn btn-outline-secondary btn-sm">
            ← Back
        </a>
    </div>


    <!-- FORMS ROW -->
    <div class="row g-4">

        <!-- MENU FORM -->
        <div class="col-md-6">
            <form th:action="@{/menu/edit/{id}(id=${menu.id})}"
                  method="post"
                  th:object="${menu}">

                <div th:replace="~{menu/fragments :: input}"></div>

                <div class="mt-3">
                    <input type="submit"
                           value="Update Menu"
                           class="btn btn-success w-100"/>
                </div>
            </form>
        </div>


        <!-- ADD MENU ITEM -->
        <div class="col-md-6">
            <form th:action="@{/menu/{id}/menuItem/create(id=${menu.id})}"
                  method="post">

                <div th:replace="~{menuItem/fragments :: input}"></div>

                <div class="mt-3">
                    <input type="submit"
                           value="Add Item"
                           class="btn btn-primary w-100"/>
                </div>
            </form>
        </div>

    </div>


    <!-- MENU ITEMS LIST -->
    <div class="row mt-5">
        <div class="col-12">
            <div th:replace="~{menuItem/fragments :: list}"></div>
        </div>
    </div>

</div>

</body>
</html>
