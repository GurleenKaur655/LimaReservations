<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <th:block th:replace="~{partial :: bootstrap}"/>
    <title>Delete Event</title>
</head>
<body>
<header>
    <nav th:replace="~{nav :: navbar}"></nav>
</header>
<div class="container mt-4">
    <main role="main" class="pb-3">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="mb-0" style="font-size: 1.8rem; font-weight: 700; color: #c0392b;">Delete Event</h4>
                    <a th:href="@{/event}" class="btn btn-outline-secondary btn-sm">← Back</a>
                </div>

                <div class="alert alert-danger mb-4">
                    ⚠️ Are you sure you want to delete this event? This action cannot be undone.
                </div>

                <div th:replace="~{event/fragments :: details}"></div>

                <div class="card shadow-sm mt-4" th:if="${eventSeating != null and !eventSeating.isEmpty()}">
                    <div class="card-header bg-light">
                        <h5 class="mb-0" style="font-family: 'Iosevka Charon Mono', monospace; font-weight: 800; color: #6B7C3A; letter-spacing: 0.5px;">Seatings for this Event</h5>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover table-striped mb-0">
                                <thead class="table-dark">
                                <tr>
                                    <th class="fw-bold">Seating Name</th>
                                    <th class="fw-bold">Dining Table</th>
                                    <th class="fw-bold">Start Time</th>
                                    <th class="fw-bold">Duration</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="seating : ${eventSeating}" class="align-middle">
                                    <td th:text="${seating.name}"></td>
                                    <td th:text="${seating.table.name}"></td>
                                    <td>
                                        <span class="badge bg-light text-dark border"
                                              th:text="${#temporals.format(seating.startDateTime, 'yyyy-MM-dd HH:mm')}"></span>
                                    </td>
                                    <td>
                                        <span class="badge bg-light text-dark border"
                                              th:text="${seating.durationMinutes} + ' min'"></span>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <form method="post" th:action="@{/event/delete/{eventId}(eventId=${event.id})}" class="mt-4">
                    <input type="submit" value="Confirm Delete" class="btn btn-danger w-100"/>
                </form>

            </div>
        </div>
    </main>
</div>
</body>
</html>
