<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <th:block th:replace="~{partial :: bootstrap}"/>
    <title>Delete album</title>
</head>
<body>
<header>
    <nav th:replace="~{nav :: navbar}"></nav>
</header>
<div class="container">
    <main role="main" class="pb-3">
        <h1>Are you sure you want to delete this Event?</h1>
        <div class="row">
            <div class="col-md-6">
                <div th:replace="~{event/fragments :: details}"></div>
                <h4>Seatings for this Event</h4>

                <table border="1">
                    <thead>
                    <tr>
                        <th>Seating Name</th>
                        <th>Dining Table</th>
                        <th>Start Time</th>
                        <th>Duration</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="seating : ${eventSeating}">

                        <td th:text="${seating.name}">Seating Name</td>

                        <td th:text="${seating.table.name}">Table Name</td>

                        <td th:text="${#temporals.format(seating.startDateTime,'yyyy-MM-dd HH:mm')}">
                            Start Time
                        </td>
                        <td th:text="${seating.durationMinutes}">
                            Duration
                        </td>
                    </tr>

                    </tbody>
                </table>
                <form method="post" th:action="@{/event/delete/{eventId}(eventId=${event.id})}">
                    <input type="submit" value="Delete" class="btn btn-danger"/>
                </form>
            </div>
        </div>
        <div>
            <a th:href="@{/event}">Go Back</a>
        </div>
    </main>
</div>
</body>
</html>
