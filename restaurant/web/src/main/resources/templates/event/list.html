<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{partial :: bootstrap}"/>
    <meta charset="UTF-8">
    <title>Event</title>
</head>
<body>
<header>
    <nav th:replace="~{nav :: navbar}"></nav>
</header>
<div class="container mt-4">
    <main role="main" class="pb-3">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="mb-0" style="font-size: 1.8rem; font-weight: 700; color: #1a1a1a;">Events</h4>
            <div class="d-flex gap-2">
                <a th:if="${viewModel.canEdit}" th:href="@{/reservation/manage}" class="btn btn-outline-dark btn-sm">
                    📋 Reservations
                </a>
                <a th:if="${viewModel.canAdd}" th:href="@{/event/create}" class="btn btn-success btn-sm">
                    <strong>+</strong> Add Event
                </a>
            </div>
        </div>

        <form th:action="@{/event/search}" method="get" class="card shadow-sm p-3 mb-4">
            <div class="row g-2 align-items-end">
                <div class="col-md-4">
                    <label class="form-label fw-bold small text-muted">Name</label>
                    <input type="text" name="name" placeholder="Search by name" class="form-control form-control-sm"/>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold small text-muted">Start Date</label>
                    <input type="date" name="startDate" class="form-control form-control-sm"/>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold small text-muted">End Date</label>
                    <input type="date" name="endDate" class="form-control form-control-sm"/>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-dark btn-sm w-100">Search</button>
                </div>
            </div>
        </form>

        <p th:if="${viewModel.message}" th:text="${viewModel.message}" class="alert alert-warning"></p>

        <div th:unless="${viewModel.isEmpty()}">
            <div class="card shadow-sm">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover table-striped mb-0">
                            <thead class="table-dark">
                            <tr>
                                <th class="fw-bold">Name</th>
                                <th class="fw-bold">Start Date</th>
                                <th class="fw-bold">End Date</th>
                                <th class="fw-bold">Price</th>
                                <th class="fw-bold" style="white-space: nowrap;">Actions</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="event: ${viewModel.events}" class="align-middle">
                                <td>
                                    <a class="text-dark text-decoration-none fw-bold"
                                       th:href="@{/event/{id}(id=${event.id})}"
                                       th:text="${event.name}"></a>
                                </td>
                                <td>
                                    <span class="badge bg-light text-dark border" th:text="${event.startDate}"></span>
                                </td>
                                <td>
                                    <span class="badge bg-light text-dark border" th:text="${event.endDate}"></span>
                                </td>
                                <td>
                                    <span class="badge bg-light text-dark border" th:text="${event.price}"></span>
                                </td>
                                <td>
                                    <div class="btn-group btn-group-sm" role="group" style="white-space: nowrap;">
                                        <a th:if="${viewModel.canEdit}" th:href="@{/event/edit/{id}(id=${event.id})}"
                                           class="btn btn-outline-warning" title="Edit Event">✏️ Edit</a>

                                        <a th:if="${viewModel.canDelete}" th:href="@{/event/delete/{id}(id=${event.id})}"
                                           class="btn btn-outline-danger" title="Delete Event">🗑️ Delete</a>

                                        <a th:if="${viewModel.canEdit}"
                                           th:href="@{/reservation/approved/{id}(id=${event.id})}"
                                           class="btn btn-outline-success" title="View Approved Reservations">✅ Reservations</a>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${viewModel.isEmpty()}">
            <div class="card shadow-sm">
                <div class="card-body text-center py-5">
                    <div class="text-muted">
                        <div class="display-1 mb-3">♪</div>
                        <h5 style="font-family: 'Iosevka Charon Mono', monospace; font-weight: 700;">No Events Found</h5>
                        <p class="mb-3">Have your own event to add?</p>
                        <a th:if="${viewModel.canAdd}" th:href="@{/event/create}" class="btn btn-primary">
                            <strong>+</strong> Add Your Event
                        </a>
                    </div>
                </div>
            </div>
        </div>

    </main>
</div>
</body>
</html>
