<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Input</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet"/>
    <script type="text/javascript" th:src="@{/js/bootstrap.min.js}"></script>
</head>
<body>

<!--/*@thymesVar id="event" type="nbcc.resto.dto.Event"*/-->

<th:block th:fragment="input" th:object="${event}">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h5 class="card-title mb-0">Events</h5>
        </div>
        <div class="card-body">
            <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" role="alert">
                <strong>Error!</strong>
                <div th:each="err : ${#fields.globalErrors}" th:text="${err}"></div>
            </div>

            <input type="hidden" th:field="*{id}"/>
            <input type="hidden" th:field="*{version}"/>

            <!--name-->
            <div class="mb-3">
                <label class="form-label fw-bold">
                    Event Name
                    <input th:field="*{name}" class="form-control mt-1" placeholder="Enter event name"/>
                </label>
                <div class="text-danger small mt-1" th:errors="*{name}"></div>
            </div>

            <!-- Description -->
            <div class="mb-3">
                <label class="form-label fw-bold">
                    Description
                    <textarea th:field="*{description}" class="form-control mt-1" placeholder="Enter description"></textarea>
                </label>
                <div class="text-danger small mt-1" th:errors="*{description}"></div>
            </div>

            <!-- Start Date -->
            <div class="mb-3">
                <label class="form-label fw-bold">
                    Start Date
                    <input type="date" th:field="*{startDate}" class="form-control mt-1"/>
                </label>
                <div class="text-danger small mt-1" th:errors="*{startDate}"></div>
            </div>

            <!-- End Date -->
            <div class="mb-3">
                <label class="form-label fw-bold">
                    End Date
                    <input type="date" th:field="*{endDate}" class="form-control mt-1"/>
                </label>
                <div class="text-danger small mt-1" th:errors="*{endDate}"></div>
            </div>

            <!-- Duration -->
            <div class="mb-3">
                <label class="form-label fw-bold">
                    Duration (minutes)
                    <input type="number" th:field="*{durationMinutes}" class="form-control mt-1"/>
                </label>
                <div class="text-danger small mt-1" th:errors="*{durationMinutes}"></div>
            </div>

            <!-- Price -->
            <div class="mb-3">
                <label class="form-label fw-bold">
                    Price
                    <input type="number" step="0.01" th:field="*{price}" class="form-control mt-1"/>
                </label>
                <div class="text-danger small mt-1" th:errors="*{price}"></div>
            </div>

            <!-- Active -->
            <div class="mb-3 form-check">
                <input type="checkbox" th:field="*{active}" class="form-check-input"/>
                <label class="form-check-label fw-bold">
                    Active
                </label>
            </div>
        </div>
    </div>
</th:block>

<th:block th:fragment="details" th:object="${event}">
    <div class="card shadow">
        <div class="card-header bg-dark text-white">
            <h4 class="card-title mb-0">Event</h4>
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-8">
                    <dl class="row">

                        <dt class="col-sm-4 text-muted">Name:</dt>
                        <dd class="col-sm-8 fw-bold fs-5" th:text="*{name}"></dd>

                        <dt class="col-sm-4 text-muted">Description:</dt>
                        <dd class="col-sm-8" th:text="*{description}"></dd>

                        <dt class="col-sm-4 text-muted">Start Date:</dt>
                        <dd class="col-sm-8">
                            <span class="badge bg-info" th:text="*{startDate}"></span>
                        </dd>

                        <dt class="col-sm-4 text-muted">End Date:</dt>
                        <dd class="col-sm-8">
                            <span class="badge bg-info" th:text="*{endDate}"></span>
                        </dd>

                        <dt class="col-sm-4 text-muted">Price:</dt>
                        <dd class="col-sm-8 fw-semibold" th:text="*{price}"></dd>

                        <dt class="col-sm-4 text-muted">Created Date:</dt>
                        <dd class="col-sm-8" th:text="*{createdDate}"></dd>

                        <dt class="col-sm-4 text-muted">Last Updated:</dt>
                        <dd class="col-sm-8" th:text="*{lastUpdatedDate}"></dd>

                    </dl>
                </div>
            </div>
        </div>
    </div>
</th:block>

</body>
</html>
