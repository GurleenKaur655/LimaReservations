<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Input</title>
    <th:block th:replace="~{partial :: bootstrap}"/>
</head>
<body>

<!--/*@thymesVar id="event" type="nbcc.resto.dto.Event"*/-->
<!--/*@thymesVar id="menus" type="java.util.List<nbcc.resto.dto.Menu>"*/-->

<th:block th:fragment="input" th:object="${event}">
    <div class="card shadow-sm">
        <div class="card-header bg-light">
            <h5 class="mb-0" style="font-family: 'Iosevka Charon Mono', monospace; font-weight: 800; color: #6B7C3A; letter-spacing: 0.5px;">Event Details</h5>
        </div>
        <div class="card-body">

            <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" role="alert">
                <strong>Error!</strong>
                <div th:each="err : ${#fields.globalErrors}" th:text="${err}"></div>
            </div>

            <input type="hidden" th:field="*{id}"/>
            <input type="hidden" th:field="*{version}"/>

            <div class="mb-3">
                <label class="form-label fw-bold small text-muted">Event Name</label>
                <input th:field="*{name}" class="form-control" placeholder="Enter event name"/>
                <div class="text-danger small mt-1" th:errors="*{name}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold small text-muted">Description</label>
                <textarea th:field="*{description}" class="form-control" placeholder="Enter description" rows="3"></textarea>
                <div class="text-danger small mt-1" th:errors="*{description}"></div>
            </div>

            <div class="row g-2 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold small text-muted">Start Date</label>
                    <input type="date" th:field="*{startDate}" class="form-control"/>
                    <div class="text-danger small mt-1" th:errors="*{startDate}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold small text-muted">End Date</label>
                    <input type="date" th:field="*{endDate}" class="form-control"/>
                    <div class="text-danger small mt-1" th:errors="*{endDate}"></div>
                </div>
            </div>

            <div class="row g-2 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold small text-muted">Duration (minutes)</label>
                    <input type="number" th:field="*{durationMinutes}" class="form-control"/>
                    <div class="text-danger small mt-1" th:errors="*{durationMinutes}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold small text-muted">Price</label>
                    <input type="number" step="0.01" th:field="*{price}" class="form-control"/>
                    <div class="text-danger small mt-1" th:errors="*{price}"></div>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold small text-muted">Menu</label>

                <!-- ✅ Search box -->
                <input type="text" id="menuSearch" class="form-control mb-2"
                       placeholder="Search menus..." onkeyup="filterMenus()">

                <div id="menuContainer" class="border p-2 rounded"
                     style="max-height: 200px; overflow-y: auto;">

                    <!-- ✅ No menu option -->
                    <div class="form-check mb-1" style="border-bottom: 1px solid #dee2e6; padding-bottom: 6px;">
                        <input class="form-check-input"
                               type="radio"
                               name="menu.id"
                               id="menu_none"
                               value=""
                               th:checked="${event.menu == null or event.menu.id == null}"/>
                        <label class="form-check-label text-muted fst-italic" for="menu_none">
                            No menu assigned
                        </label>
                    </div>

                    <!-- ✅ Menu options -->
                    <div th:each="menu : ${menus}" class="form-check menu-item">
                        <input class="form-check-input"
                               type="radio"
                               th:field="*{menu.id}"
                               th:value="${menu.id}"
                               th:id="'menu_' + ${menu.id}">
                        <label class="form-check-label"
                               th:for="'menu_' + ${menu.id}"
                               th:text="${menu.name}">
                        </label>
                    </div>

                </div>

                <div class="text-danger small mt-1" th:errors="*{menu.id}"></div>
            </div>

            <div class="mb-3 form-check">
                <input type="checkbox" th:field="*{active}" class="form-check-input"/>
                <label class="form-check-label fw-bold small text-muted">Active</label>
            </div>

        </div>
    </div>

    <!-- ✅ Script INSIDE the input fragment — critical for it to be included -->
    <script>
        function filterMenus() {
            let input = document.getElementById('menuSearch');
            let filter = input.value.toLowerCase();
            let container = document.getElementById('menuContainer');
            let items = container.getElementsByClassName('menu-item');

            for (let i = 0; i < items.length; i++) {
                let label = items[i].getElementsByTagName('label')[0];
                let text = label.textContent || label.innerText;
                items[i].style.display = text.toLowerCase().indexOf(filter) > -1 ? "" : "none";
            }
        }
    </script>

</th:block>

<th:block th:fragment="details" th:object="${event}">
    <div class="card shadow-sm">
        <div class="card-header bg-light">
            <h5 class="mb-0" style="font-family: 'Iosevka Charon Mono', monospace; font-weight: 800; color: #6B7C3A; letter-spacing: 0.5px;">Event Details</h5>
        </div>
        <div class="card-body">
            <dl class="row">
                <dt class="col-sm-4 text-muted small">Name</dt>
                <dd class="col-sm-8 fw-bold" th:text="*{name}"></dd>

                <dt class="col-sm-4 text-muted small">Description</dt>
                <dd class="col-sm-8" th:text="*{description}"></dd>

                <dt class="col-sm-4 text-muted small">Start Date</dt>
                <dd class="col-sm-8">
                    <span class="badge bg-light text-dark border" th:text="*{startDate}"></span>
                </dd>

                <dt class="col-sm-4 text-muted small">End Date</dt>
                <dd class="col-sm-8">
                    <span class="badge bg-light text-dark border" th:text="*{endDate}"></span>
                </dd>

                <dt class="col-sm-4 text-muted small">Price</dt>
                <dd class="col-sm-8 fw-semibold" th:text="'$' + *{price}"></dd>

                <dt class="col-sm-4 text-muted small">Created Date</dt>
                <dd class="col-sm-8" th:text="${#temporals.format(event.createdDate, 'MMM dd, yyyy h:mm a')}"></dd>

                <dt class="col-sm-4 text-muted small">Last Updated</dt>
                <dd class="col-sm-8" th:text="${#temporals.format(event.lastUpdatedDate, 'MMM dd, yyyy h:mm a')}"></dd>
            </dl>
        </div>
    </div>
</th:block>

</body>
</html>
