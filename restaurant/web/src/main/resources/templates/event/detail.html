<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <th:block th:replace="~{partial :: bootstrap}"/>
    <title>Event Details</title>
</head>
<body>
<header>
    <nav th:replace="~{nav :: navbar}"></nav>
</header>
<div class="container mt-4">

        <div class="row justify-content-center">
            <div class="col-md-6">

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="mb-0" style="font-size: 1.8rem; font-weight: 700; color: #1a1a1a;">Event Details</h4>
                    <a th:href="@{/event}" class="btn btn-outline-secondary btn-sm">← Back</a>
                </div>

                <div th:replace="~{event/fragments :: details}"></div>

            </div>
        </div>
    </main>
</div>
</body>
</html>
