<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <th:block th:replace="~{partial :: bootstrap}"/>
    <title>Event Details</title>
</head>
<body>
<header>
    <nav th:replace="~{nav :: navbar}"></nav>
</header>
<div class="container mt-4">
    <main role="main" class="pb-3">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="mb-0" style="font-size: 1.8rem; font-weight: 700; color: #1a1a1a;">Event Details</h4>
                    <a th:href="@{/event}" class="btn btn-outline-secondary btn-sm">← Back to List</a>
                </div>

                <div th:replace="~{event/fragments :: details}"></div>

                <div class="card mt-4 shadow-sm border-0 bg-light">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <span class="text-muted fw-bold">Manage Event</span>
                        <a th:href="@{/reservation/approved/{id}(id=${event.id})}"
                           class="btn btn-success">
                            ✅ View Approved Reservations
                        </a>
                        <a th:href="@{/event/delete/{id}(id=${event.id})}"
                           class="btn btn-outline-danger btn-sm">
                            🗑️ Delete
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </main>
</div>
</body>
</html>
