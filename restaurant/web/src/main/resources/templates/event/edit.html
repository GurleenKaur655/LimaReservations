<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <th:block th:replace="~{partial :: bootstrap}"/>
    <title>Edit Event</title>
</head>
<body>
<header>
    <nav th:replace="~{nav :: navbar}"></nav>
</header>
<div class="container mt-4">
    <main role="main" class="pb-3">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="mb-0" style="font-size: 1.8rem; font-weight: 700; color: #1a1a1a;">Edit Event</h4>
                    <a th:href="@{/event}" class="btn btn-outline-secondary btn-sm">← Back</a>
                </div>

                <form th:action="@{/event/edit/{id}(id=${event.id})}" method="post" th:object="${event}">
                    <div th:replace="~{event/fragments :: input}"></div>
                    <div class="mt-3">
                        <input type="submit" value="Update Event" class="btn btn-success w-100"/>
                    </div>
                </form>

            </div>
        </div>
    </main>
</div>
</body>
</html>
