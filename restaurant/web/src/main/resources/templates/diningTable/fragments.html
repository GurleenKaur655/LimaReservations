<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Input</title>
    <th:block th:replace="~{partial :: bootstrap}"/>
</head>
<body>

<!--/*@thymesVar id="table" type="nbcc.resto.dto.DiningTable"*/-->

<th:block th:fragment="input" th:object="${table}">
    <div class="card shadow-sm">
        <div class="card-header bg-light">
            <h5 class="mb-0" style="font-family: 'Iosevka Charon Mono', monospace; font-weight: 800; color: #6B7C3A; letter-spacing: 0.5px;">Dining Table Details</h5>
        </div>
        <div class="card-body">

            <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" role="alert">
                <strong>Error!</strong>
                <div th:each="err : ${#fields.globalErrors}" th:text="${err}"></div>
            </div>

            <input type="hidden" th:field="*{id}"/>
            <input type="hidden" th:field="*{version}"/>

            <div class="mb-3">
                <label class="form-label fw-bold small text-muted">Table Name</label>
                <input th:field="*{name}" class="form-control" placeholder="Have a good name? or Should I give one?"/>
                <div class="text-danger small mt-1" th:errors="*{name}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold small text-muted">Capacity</label>
                <input type="number" th:field="*{capacity}" class="form-control" placeholder="Enter seating capacity"/>
                <div class="text-danger small mt-1" th:errors="*{capacity}"></div>
            </div>

        </div>
    </div>
</th:block>

</body>
</html>
