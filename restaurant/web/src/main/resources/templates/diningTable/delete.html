<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <th:block th:replace="~{partial :: bootstrap}"/>
    <title>Delete Dining Table</title>
</head>
<body>
<header>
    <nav th:replace="~{nav :: navbar}"></nav>
</header>
<div class="container mt-4">
    <main role="main" class="pb-3">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="mb-0" style="font-size: 1.8rem; font-weight: 700; color: #c0392b;">Delete Dining Table</h4>
                    <a th:href="@{/diningTable}" class="btn btn-outline-secondary btn-sm">← Back</a>
                </div>

                <div class="alert alert-danger mb-4">
                    ⚠️ Are you sure you want to delete this table? This action cannot be undone.
                </div>
                <div class="alert alert-danger mb-4">
                    All the seatings and reservation associated with the dining table will also be deleted.
                </div>

                <div class="card shadow-sm">
                    <div class="card-header bg-light">
                        <h5 class="mb-0" style="font-family: 'Iosevka Charon Mono', monospace; font-weight: 800; color: #6B7C3A; letter-spacing: 0.5px;">Table Details</h5>
                    </div>
                    <div class="card-body">
                        <dl class="row mb-0">
                            <dt class="col-sm-4 text-muted small">Table Name</dt>
                            <dd class="col-sm-8 fw-bold" th:text="${table.name}"></dd>

                            <dt class="col-sm-4 text-muted small">Capacity</dt>
                            <dd class="col-sm-8">
                                <span class="badge bg-light text-dark border" th:text="${table.capacity}"></span>
                            </dd>
                        </dl>
                    </div>
                </div>

                <form th:action="@{/diningTable/delete/{id}(id=${table.id})}" method="post" class="mt-4">
                    <input type="submit" value="Confirm Delete" class="btn btn-danger w-100"/>
                </form>

            </div>
        </div>
    </main>
</div>
</body>
</html>
