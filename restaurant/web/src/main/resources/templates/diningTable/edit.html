<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <th:block th:replace="~{partial :: bootstrap}"/>
    <title>Edit Dining Table</title>
</head>
<body>
<header>
    <nav th:replace="~{nav :: navbar}"></nav>
</header>
<div class="container mt-4">
    <main role="main" class="pb-3">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="mb-0" style="font-size: 1.8rem; font-weight: 700; color: #1a1a1a;">Edit Dining Table</h4>
                    <a th:href="@{/diningTable}" class="btn btn-outline-secondary btn-sm">← Back</a>
                </div>

                <form th:action="@{/diningTable/edit/{id}(id=${table.id})}" method="post" th:object="${table}">
                    <input type="hidden" th:field="*{id}"/>
                    <input type="hidden" th:field="*{version}"/>
                    <div th:replace="~{diningtable/fragments :: input}"></div>
                    <div class="mt-3">
                        <input type="submit" value="Update Table" class="btn btn-success w-100"/>
                    </div>
                </form>

            </div>
        </div>
    </main>
</div>
</body>
</html>
