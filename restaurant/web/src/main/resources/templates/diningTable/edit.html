<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <th:block th:replace="~{partial :: bootstrap}"/>
    <title>Edit Dining Table</title>
</head>

<body>

<header>
    <nav th:replace="~{nav :: navbar}"></nav>
</header>

<div class="container">

    <main role="main" class="pb-3">

        <div class="row">
            <div class="col-md-4">

                <h4 class="mb-3">Edit Dining Table</h4>

                <form th:action="@{/diningTable/edit/{id}(id=${table.id})}"
                      method="post"
                      th:object="${table}">

                    <input type="hidden" th:field="*{id}"/>
                    <input type="hidden" th:field="*{version}"/>

                    <div th:replace="~{diningtable/fragments :: input}"></div>

                    <div class="form-group mt-3">

                        <input type="submit"
                               value="Update"
                               class="btn btn-primary"/>

                        <a th:href="@{/diningTable}"
                           class="btn btn-secondary">
                            Cancel
                        </a>

                    </div>

                </form>

            </div>
        </div>

    </main>

</div>

</body>
</html>
