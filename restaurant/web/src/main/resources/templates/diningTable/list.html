<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{partial :: bootstrap}"/>
    <meta charset="UTF-8">
    <title>Dining Tables</title>
</head>
<body>
<header>
    <nav th:replace="~{nav :: navbar}"></nav>
</header>

<div class="container mt-4">
    <main role="main" class="pb-3">

        <p th:if="${viewModel.message}" th:text="${viewModel.message}" class="alert alert-warning"></p>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="mb-0" style="font-size: 1.8rem; font-weight: 700; color: #1a1a1a;">Dining Tables</h4>
            <a th:href="@{/diningTable/create}" class="btn btn-success btn-sm">
                <strong>+</strong> Add Table
            </a>
        </div>

        <div th:unless="${viewModel.isEmpty()}">
            <div class="card shadow-sm">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover table-striped mb-0">
                            <thead class="table-dark">
                            <tr>
                                <th class="fw-bold">Table Name</th>
                                <th class="fw-bold">Capacity</th>
                                <th class="fw-bold" style="width:160px;">Actions</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="table : ${viewModel.tables}" class="align-middle">
                                <td><strong th:text="${table.name}"></strong></td>
                                <td>
                                    <span class="badge bg-light text-dark border" th:text="${table.capacity}"></span>
                                </td>
                                <td>
                                    <div class="btn-group btn-group-sm" role="group">
                                        <a class="btn btn-outline-warning"
                                           th:href="@{/diningTable/edit/{id}(id=${table.id})}">✏️ Edit</a>
                                        <a class="btn btn-outline-danger"
                                           th:href="@{/diningTable/delete/{id}(id=${table.id})}">🗑️ Delete</a>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${viewModel.isEmpty()}">
            <div class="card shadow-sm">
                <div class="card-body text-center py-5">
                    <div class="text-muted">
                        <div class="display-1 mb-3">🍽</div>
                        <h5 style="font-family: 'Iosevka Charon Mono', monospace; font-weight: 700;">No Tables Found</h5>
                        <p class="mb-3">Create your first dining table.</p>
                        <a th:href="@{/diningTable/create}" class="btn btn-primary">
                            <strong>+</strong> Add Table
                        </a>
                    </div>
                </div>
            </div>
        </div>

    </main>
</div>
</body>
</html>
