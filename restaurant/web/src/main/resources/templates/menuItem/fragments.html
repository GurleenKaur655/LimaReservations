<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>MenuItem Fragments</title>
</head>
<body>

<!--/*@thymesVar id="menuItem" type="nbcc.resto.dto.MenuItem"*/-->
<th:block th:fragment="input">
    <th:block th:object="${menuItem}" th:if="${menuItem != null}">
        <div class="card shadow-sm">
            <div class="card-header bg-success text-white">
                <h5 class="card-title mb-0">🍽️ Menu Item Information</h5>
            </div>
            <div class="card-body">
                <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" role="alert">
                    <strong>Error!</strong>
                    <div th:each="err : ${#fields.globalErrors}" th:text="${err}"></div>
                </div>

                <input type="hidden" th:field="*{id}"/>
                <input type="hidden" th:field="*{version}"/>
                <input type="hidden" th:field="*{menu.id}" th:if="*{menu}"/>
                <input type="hidden" th:field="*{menu.version}" th:if="*{menu}"/>

                <div class="mb-3">
                    <label class="form-label fw-bold">
                        Item Name
                        <input th:field="*{name}" class="form-control mt-1" placeholder="Enter menu item name"/>
                    </label>
                    <div class="text-danger small mt-1" th:errors="*{name}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">
                        Description
                        <textarea th:field="*{description}" class="form-control mt-1" placeholder="Enter description"></textarea>
                    </label>
                    <div class="text-danger small mt-1" th:errors="*{description}"></div>
                </div>
            </div>
        </div>
    </th:block>
</th:block>

<th:block th:fragment="details">
    <th:block th:object="${menuItem}" th:if="${menuItem != null}">
        <div class="card shadow">
            <div class="card-header bg-light">
                <h5 class="mb-0"
                    style="font-family: 'Iosevka Charon Mono', monospace; font-weight: 800; color: #6B7C3A; letter-spacing: 0.5px;">
                    Menu Item
                </h5>
            </div>
            <div class="card-body">
                <dl class="row">
                    <dt class="col-sm-4 text-muted">Name:</dt>
                    <dd class="col-sm-8 fw-bold fs-5" th:text="*{name}"></dd>


                    <dt class="col-sm-4 text-muted">Description:</dt>
                    <dd class="col-sm-8" th:text="*{description} ?: 'No description'"></dd>

                </dl>
            </div>
        </div>
    </th:block>
</th:block>

<!--/*@thymesVar id="menuItemListViewModel" type="nbcc.resto.viewmodel.MenuItemListViewModel"*/-->
<th:block th:fragment="list" th:object="${menuItemListViewModel}">
    <div class="card shadow-sm">
        <div class="card-header bg-light d-flex justify-content-between align-items-center">
            <h5 class="card-title mb-0 text-dark">🍽️ Menu Items Collection</h5>
            <a th:if="*{canAdd}" th:href="@{/menu/{menuId}/menuItem/create(menuId=*{menuId})}" class="btn btn-success btn-sm">
                <strong>+</strong> Add Menu Item
            </a>
        </div>
        <div class="card-body p-0" th:unless="*{isEmpty()}">
            <div class="table-responsive">
                <table class="table table-hover table-striped mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th class="fw-bold">🍽️ Name</th>
                        <th class="fw-bold">Description</th>
                        <th class="fw-bold text-center">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="menuItem : *{menuItems}" class="align-middle">
                        <td th:text="${menuItem.name}" class="text-success fw-bold"></td>
                        <td th:text="${menuItem.description ?: 'No description'}"></td>
                        <td class="text-center">
                            <div class="btn-group btn-group-sm" role="group">
                                <a th:if="*{canEdit}" th:href="@{/menu/{menuId}/menuItem/edit/{id}(id=${menuItem.id}, menuId=*{menuId})}"
                                   class="btn btn-outline-warning" title="Edit Menu Item">
                                    ✏️ Edit
                                </a>
                                <a th:if="*{canDelete}" th:href="@{/menu/{menuId}/menuItem/delete/{id}(id=${menuItem.id}, menuId=*{menuId})}"
                                   class="btn btn-outline-danger" title="Delete Menu Item">
                                    🗑️ Delete
                                </a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-body text-center py-5" th:if="*{isEmpty()}">
            <div class="text-muted">
                <div class="display-1 mb-3">🍽️</div>
                <h5>No Menu Items Found</h5>
                <p class="mb-3">Add items to your menu!</p>
                <a th:href="@{/menu/{menuId}/menuItem/create(menuId=*{menuId})}" class="btn btn-success">
                    <strong>+</strong> Add Your First Menu Item
                </a>
            </div>
        </div>
    </div>
</th:block>

</body>
</html>
