<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <th:block th:replace="~{partial :: bootstrap}"/>
    <title>Edit Menu Item</title>
</head>
<body>
<header>
    <nav th:replace="~{nav :: navbar}"></nav>
</header>

<div class="container">
    <main role="main" class="pb-3">
        <div class="row">
            <div class="col-md-6">
                <div th:replace="~{menu/fragments :: details}"></div>
            </div>
            <div class="col-md-6">
                <form method="post"
                      th:action="@{/menu/{menuId}/menuItem/edit(menuId=${menu.id})}"
                      th:object="${menuItem}">

                    <div th:replace="~{menuItem/fragments :: input}"></div>

                    <div class="form-group mt-3">
                        <input type="submit" value="Update" class="btn btn-primary"/>
                    </div>
                </form>
            </div>
        </div>

        <div class="mt-3">
            <a th:href="@{/menu/edit/{id}(id=${menu.id})}">Go Back</a>
        </div>
    </main>
</div>
</body>
</html>
