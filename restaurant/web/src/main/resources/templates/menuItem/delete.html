<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <th:block th:replace="~{partial :: bootstrap}"/>
    <title>Delete Menu Item</title>
</head>
<body>
<header>
    <nav th:replace="~{nav :: navbar}"></nav>
</header>

<div class="container mt-4">
    <main class="pb-3">

        <div class="row justify-content-center">
            <div class="col-md-6">

                <h4 class="mb-3 text-danger fw-bold">
                    Delete Menu Item
                </h4>

                <div class="alert alert-danger">
                    ⚠️ Are you sure you want to delete this item?
                </div>

                <div th:replace="~{menu/fragments :: details}"></div>
                <div th:replace="~{menuItem/fragments :: details}"></div>

                <form method="post"
                      th:action="@{/menu/{menuId}/menuItem/delete/{id}(menuId=${menu.id}, id=${menuItem.id})}"
                      class="mt-3">

                    <input type="submit"
                           value="Delete"
                           class="btn btn-danger w-100"/>
                </form>

                <div class="mt-3">
                    <a th:href="@{/menu/edit/{id}(id=${menu.id})}"
                       class="btn btn-outline-secondary btn-sm">← Back</a>
                </div>

            </div>
        </div>

    </main>
</div>
</body>
</html>
