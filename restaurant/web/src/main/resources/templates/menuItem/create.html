<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <th:block th:replace="~{partial :: bootstrap}"/>
    <title>Create Menu Item</title>
</head>
<body>
<header>
    <nav th:replace="~{nav :: navbar}"></nav>
</header>

<div class="container mt-4">
    <main class="pb-3">

        <div class="row">

            <div class="col-md-6">
                <div th:replace="~{menu/fragments :: details}"></div>
            </div>


            <div class="col-md-6">
                <form method="post"
                      th:action="@{/menu/{menuId}/menuItem/create(menuId=${menuItem.menu.id})}"
                      th:object="${menuItem}">

                    <div th:replace="~{menuItem/fragments :: input}"></div>

                    <div class="mt-3">
                        <input type="submit" value="Create"
                               class="btn btn-primary w-100"/>
                    </div>
                </form>
            </div>
        </div>

        <div class="mt-3">
            <a th:href="@{/menu/edit/{id}(id=${menu.id})}"
               class="btn btn-outline-secondary btn-sm">← Back</a>
        </div>

    </main>
</div>
</body>
</html>
