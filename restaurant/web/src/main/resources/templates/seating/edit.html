<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <th:block th:replace="~{partial :: bootstrap}"/>
    <title>Create Seating</title>
</head>
<body>
<header>
    <nav th:replace="~{nav :: navbar}"></nav>
</header>
<div class="container mt-4">
    <main role="main" class="pb-3">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="mb-0" style="font-size: 1.8rem; font-weight: 700; color: #1a1a1a;">Edit Seating</h4>
                    <a th:href="@{/seating}" class="btn btn-outline-secondary btn-sm">← Back</a>
                </div>

                <form th:action="@{/seating/edit/{id}(id=${seating.id})}" method="post" th:object="${seating}">
                    <div class="card shadow-sm">
                        <div class="card-header bg-light">
                            <h5 class="mb-0" style="font-family: 'Iosevka Charon Mono', monospace; font-weight: 800; color: #6B7C3A; letter-spacing: 0.5px;">Seating Details</h5>
                        </div>
                        <div class="card-body">
                            <input type="hidden" th:field="*{id}"/>
                            <input type="hidden" th:field="*{version}"/>

                            <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" role="alert">
                                <strong>Error!</strong>
                                <div th:each="err : ${#fields.globalErrors}" th:text="${err}"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold small text-muted">Name</label>
                                <input type="text" class="form-control" th:field="*{name}" placeholder="Enter seating name"/>
                                <div class="text-danger small mt-1" th:errors="*{name}"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold small text-muted">Event</label>
                                <select class="form-select" th:field="*{event.id}">
                                    <option value="" disabled selected>Select Event</option>
                                    <option th:each="event : ${events}"
                                            th:value="${event.id}"
                                            th:text="${event.name}">
                                    </option>
                                </select>
                                <div class="text-danger small mt-1" th:errors="*{event.id}"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold small text-muted">Dining Table</label>
                                <select class="form-select" th:field="*{table.id}">
                                    <option value="" disabled selected>Select Dining Table</option>
                                    <option th:each="table : ${tables}"
                                            th:value="${table.id}"
                                            th:text="${table.name}">
                                    </option>
                                </select>
                                <div class="text-danger small mt-1" th:errors="*{table.id}"></div>
                            </div>

                            <div class="row g-2 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold small text-muted">Start Date & Time</label>
                                    <input type="datetime-local" class="form-control" th:field="*{startDateTime}"/>
                                    <div class="text-danger small mt-1" th:errors="*{startDateTime}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold small text-muted">Duration (minutes)</label>
                                    <input type="number" class="form-control" th:field="*{durationMinutes}" placeholder="e.g. 90"/>
                                    <div class="text-danger small mt-1" th:errors="*{durationMinutes}"></div>
                                </div>
                            </div>

                        </div>
                    </div>

                    <div class="mt-3">
                        <input type="submit" value="Update Seating" class="btn btn-success w-100"/>
                    </div>

                </form>
            </div>
        </div>
    </main>
</div>
</body>
</html>
