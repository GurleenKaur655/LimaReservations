<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <th:block th:replace="~{partial :: bootstrap}"/>
    <title>Create Seating</title>
</head>
<body>
<header>
    <nav th:replace="~{nav :: navbar}"></nav>
</header>
<div class="container mt-4">
    <main role="main" class="pb-3">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="mb-0" style="font-size: 1.8rem; font-weight: 700; color: #1a1a1a;">Add Seating</h4>
                    <a th:href="@{/seating}" class="btn btn-outline-secondary btn-sm">← Back</a>
                </div>

                <form th:action="@{/seating/create}" method="post" th:object="${seating}">
                    <div class="card shadow-sm">
                        <div class="card-header bg-light">
                            <h5 class="mb-0" style="font-family: 'Iosevka Charon Mono', monospace; font-weight: 800; color: #6B7C3A; letter-spacing: 0.5px;">Seating Details</h5>
                        </div>
                        <div class="card-body">

                            <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" role="alert">
                                <strong>Error!</strong>
                                <div th:each="err : ${#fields.globalErrors}" th:text="${err}"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold small text-muted">Name</label>
                                <input type="text" class="form-control" th:field="*{name}" placeholder="Enter seating name"/>
                                <div class="text-danger small mt-1" th:errors="*{name}"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold small text-muted">Event</label>

                                <div>
                                    <div th:each="event : ${events}" class="form-check">
                                        <input class="form-check-input"
                                               type="radio"
                                               th:field="*{event.id}"
                                               th:value="${event.id}"
                                               th:id="'event_' + ${event.id}"/>

                                        <label class="form-check-label"
                                               th:for="'event_' + ${event.id}"
                                               th:text="${event.name}">
                                        </label>
                                    </div>
                                </div>

                                <div class="text-danger small mt-1" th:errors="*{event}"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold small text-muted">Dining Tables</label>

                                <input type="text" id="tableSearch" class="form-control mb-2" placeholder="Search tables..." onkeyup="filterTables()">

                                <div id="tableCheckboxContainer" class="border p-2 rounded" style="max-height: 200px; overflow-y: auto;">
                                    <div th:each="table : ${tables}" class="form-check table-item">
                                        <input class="form-check-input"
                                               type="checkbox"
                                               th:field="*{tableIds}"
                                               th:value="${table.id}"
                                               th:id="'table_' + ${table.id}">
                                        <label class="form-check-label" th:for="'table_' + ${table.id}" th:text="${table.name}">
                                            Table Name
                                        </label>
                                    </div>
                                </div>

                                <div class="text-danger small mt-1" th:errors="*{tables}"></div>
                            </div>

                            <div class="row g-2 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold small text-muted">Start Date & Time</label>
                                    <input type="datetime-local" class="form-control" th:field="*{startDateTime}"/>
                                    <div class="text-danger small mt-1" th:errors="*{startDateTime}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold small text-muted">Duration (minutes)</label>
                                    <input type="number" class="form-control" th:field="*{durationMinutes}" placeholder="e.g. 90"/>
                                    <div class="text-danger small mt-1" th:errors="*{durationMinutes}"></div>
                                </div>
                            </div>

                        </div>
                    </div>

                    <div class="mt-3">
                        <input type="submit" value="Save Seating" class="btn btn-success w-100"/>
                    </div>

                </form>
            </div>
        </div>
    </main>
</div>
</body>
</html>
<script>
    function filterTables() {
        // Get search value
        let input = document.getElementById('tableSearch');
        let filter = input.value.toLowerCase();

        // Get all table items
        let container = document.getElementById('tableCheckboxContainer');
        let items = container.getElementsByClassName('table-item');

        // Loop through items and toggle visibility
        for (let i = 0; i < items.length; i++) {
            let label = items[i].getElementsByTagName('label')[0];
            let text = label.textContent || label.innerText;

            if (text.toLowerCase().indexOf(filter) > -1) {
                items[i].style.display = "";
            } else {
                items[i].style.display = "none";
            }
        }
    }
</script>
