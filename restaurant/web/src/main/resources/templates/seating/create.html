<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <th:block th:replace="~{partial :: bootstrap}"/>
    <title>Create Seating</title>
</head>

<body>

<header>
    <nav th:replace="~{nav :: navbar}"></nav>
</header>

<div class="container">

    <main role="main" class="pb-3">

        <div class="row">
            <div class="col-md-4">

                <form th:action="@{/seating/create}" method="post" th:object="${seating}">


                    <div class="alert alert-danger"
                         th:if="${#fields.hasGlobalErrors()}">
                        <div th:each="err : ${#fields.globalErrors}"
                             th:text="${err}">
                        </div>
                    </div>

                    <div class="form-group mb-3">
                        <label>Name</label>
                        <input type="text" class="form-control" th:field="*{name}"/>
                        <div class="alert alert-danger  small mt-1" th:errors="*{name}"></div>
                    </div>

                    <div class="form-group mb-3">
                        <label>Event</label>

                        <select class="form-control" th:field="*{event.id}">
                            <option value="" disabled selected class="text-muted">
                                Select Event
                            </option>

                            <option th:each="event : ${events}"
                                    th:value="${event.id}"
                                    th:text="${event.name}">
                            </option>
                        </select>

                        <div class="alert alert-danger small mt-1" th:errors="*{event.id}"></div>
                    </div>

                    <div class="form-group mb-3">
                        <label>Dining Table</label>
                        <select class="form-control" th:field="*{table.id}">
                            <option value="" disabled selected class="text-muted" >
                                Select Dining Table
                            </option>
                            <option th:each="table : ${tables}"
                                    th:value="${table.id}"
                                    th:text="${table.name}">
                            </option>
                        </select>

                        <div class="alert alert-danger  small mt-1" th:errors="*{table.id}"></div>
                    </div>

                    <div class="form-group mb-3">
                        <label>Start Date & Time</label>
                        <input type="datetime-local"
                               class="form-control"
                               th:field="*{startDateTime}"/>

                        <div class="alert alert-danger  small mt-1" th:errors="*{startDateTime}"></div>
                    </div>

                    <div class="form-group mb-3">
                        <label>Duration (minutes)</label>
                        <input type="number"
                               class="form-control"
                               th:field="*{durationMinutes}"/>

                        <div class="alert alert-danger  small mt-1" th:errors="*{durationMinutes}"></div>
                    </div>

                    <div class="form-group mt-3">
                        <input type="submit" value="Save" class="btn btn-primary"/>
                    </div>

                </form>

            </div>
        </div>

        <div class="mt-3">
            <a th:href="@{/seating}">Go Back</a>
        </div>

    </main>

</div>

</body>
</html>
