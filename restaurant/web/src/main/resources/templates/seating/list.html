<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Seating</title>
    <th:block th:replace="~{partial :: bootstrap}"/>
</head>
<body>
<header>
    <nav th:replace="~{nav :: navbar}"></nav>
</header>

<div class="container mt-4">
    <main role="main" class="pb-3">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="mb-0" style="font-size: 1.8rem; font-weight: 700; color: #1a1a1a;">SEATINGS</h4>
            <a th:if="${viewModel.canAdd}" th:href="@{/seating/create}" class="btn btn-success btn-sm">
                <strong>+</strong> Add Seating
            </a>
        </div>

        <div th:unless="${viewModel.isEmpty()}">
            <div th:each="entry : ${viewModel.seatingsByEventName}" class="card shadow-sm mb-4">
                <div class="card-header bg-light">
                    <h5 class="mb-0" style="font-size: 1.3rem; font-weight: 800; color: #6B7C3A; letter-spacing: 0.5px;"
                        th:text="${entry.key}">Event Name</h5>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover table-striped mb-0">
                            <thead class="table-dark">
                            <tr>
                                <th class="fw-bold">Seating Name</th>
                                <th class="fw-bold">Dining Tables</th>
                                <th class="fw-bold">Start Time</th>
                                <th class="fw-bold">Duration</th>
                                <th class="fw-bold" style="width: 140px;">Actions</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="seating : ${entry.value}" class="align-middle">
                                <td th:text="${seating.name}">Seating Name</td>

                                <td>
                                    <span th:if="${seating.tables == null or seating.tables.isEmpty()}"
                                          class="text-muted fst-italic">No tables assigned</span>
                                    <span th:each="t, i : ${seating.tables}">
                                        <span class="badge bg-secondary"
                                              th:text="${t.name}">Table Name</span>
                                    </span>
                                </td>

                                <td>
                                    <span class="badge bg-light text-dark border"
                                          th:text="${#temporals.format(seating.startDateTime, 'yyyy-MM-dd HH:mm')}">
                                        Start Time
                                    </span>
                                </td>
                                <td>
                                    <span class="badge bg-light text-dark border"
                                          th:text="${seating.durationMinutes} + ' min'">
                                        Duration
                                    </span>
                                </td>
                                <td>
                                    <a th:if="${viewModel.canEdit}"
                                       th:href="@{/seating/edit/{id}(id=${seating.id})}"
                                       class="btn btn-outline-warning btn-sm" title="Edit Seating">✏️ Edit</a>
                                    <a th:if="${viewModel.canDelete}"
                                       th:href="@{/seating/delete/{id}(id=${seating.id})}"
                                       class="btn btn-outline-danger btn-sm" title="Delete Seating">🗑️ Delete</a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${viewModel.isEmpty()}">
            <div class="card shadow-sm">
                <div class="card-body text-center py-5">
                    <div class="text-muted">
                        <div class="display-1 mb-3">🪑</div>
                        <h5>No Seating Found</h5>
                        <p class="mb-0">No seating has been arranged yet.</p>
                    </div>
                </div>
            </div>
        </div>

    </main>
</div>
</body>
</html>
