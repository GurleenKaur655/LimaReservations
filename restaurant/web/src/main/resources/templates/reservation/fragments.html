<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reservation Fragments</title>
    <th:block th:replace="~{partial :: bootstrap}"/>
</head>
<body>

<!--/*@thymesVar id="reservation" type="nbcc.resto.dto.Reservation"*/-->

<th:block th:fragment="input" th:object="${reservation}">
    <div class="card shadow-sm">
        <div class="card-header bg-light">
            <h5 class="mb-0" style="font-family: 'Iosevka Charon Mono', monospace; font-weight: 800; color: #6B7C3A; letter-spacing: 0.5px;">Reservation Details</h5>
        </div>
        <div class="card-body">

            <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" role="alert">
                <strong>Error!</strong>
                <div th:each="err : ${#fields.globalErrors}" th:text="${err}"></div>
            </div>

            <input type="hidden" th:field="*{id}"/>
            <input type="hidden" th:field="*{version}"/>

            <div class="mb-3">
                <label class="form-label fw-bold small text-muted">First Name</label>
                <input th:field="*{firstName}" class="form-control" placeholder="Enter first name"/>
                <div class="text-danger small mt-1" th:errors="*{firstName}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold small text-muted">Last Name</label>
                <input th:field="*{lastName}" class="form-control" placeholder="Enter last name"/>
                <div class="text-danger small mt-1" th:errors="*{lastName}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold small text-muted">Email Address</label>
                <input type="email" th:field="*{email}" class="form-control" placeholder="Enter email address"/>
                <div class="text-danger small mt-1" th:errors="*{email}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold small text-muted">Group Size</label>
                <input type="number" min="1" th:field="*{groupSize}" class="form-control" placeholder="Enter group size"/>
                <div class="text-danger small mt-1" th:errors="*{groupSize}"></div>
            </div>

        </div>
    </div>
</th:block>

<!--/*@thymesVar id="reservation" type="nbcc.resto.dto.Reservation"*/-->

<th:block th:fragment="details" th:object="${reservation}">
    <div class="card shadow-sm">
        <div class="card-header bg-light">
            <h5 class="mb-0" style="font-family: 'Iosevka Charon Mono', monospace; font-weight: 800; color: #6B7C3A; letter-spacing: 0.5px;">Reservation Details</h5>
        </div>
        <div class="card-body">
            <dl class="row">
                <dt class="col-sm-4 text-muted small">First Name</dt>
                <dd class="col-sm-8 fw-bold" th:text="*{firstName}"></dd>

                <dt class="col-sm-4 text-muted small">Last Name</dt>
                <dd class="col-sm-8 fw-bold" th:text="*{lastName}"></dd>

                <dt class="col-sm-4 text-muted small">Email</dt>
                <dd class="col-sm-8" th:text="*{email}"></dd>

                <dt class="col-sm-4 text-muted small">Group Size</dt>
                <dd class="col-sm-8" th:text="*{groupSize}"></dd>

                <dt class="col-sm-4 text-muted small">Status</dt>
                <dd class="col-sm-8">
                    <span class="badge bg-warning text-dark" th:if="*{status?.name() == 'PENDING'}" th:text="*{status}"></span>
                    <span class="badge bg-success" th:if="*{status?.name() == 'APPROVED'}" th:text="*{status}"></span>
                    <span class="badge bg-danger" th:if="*{status?.name() == 'DENIED'}" th:text="*{status}"></span>
                </dd>
            </dl>
        </div>
    </div>
</th:block>

</body>
</html>
