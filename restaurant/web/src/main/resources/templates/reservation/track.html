<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{partial :: bootstrap}"/>
    <meta charset="UTF-8">
    <title>Track Reservation</title>
</head>
<body>
<header>
    <nav th:replace="~{nav :: navbar}"></nav>
</header>
<div class="container mt-4">
    <main role="main" class="pb-3">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="mb-0" style="font-size: 1.8rem; font-weight: 700; color: #1a1a1a;">Reservation Status</h4>
                    <a th:href="@{/reservation}" class="btn btn-outline-secondary btn-sm">← Back</a>
                </div>

                <div class="card shadow-sm" th:object="${reservation}">
                    <div class="card-header bg-light d-flex justify-content-between align-items-center">
                        <h5 class="mb-0" style="font-family: 'Iosevka Charon Mono', monospace; font-weight: 800; color: #6B7C3A;">
                            Reservation Details
                        </h5>
                        <span th:if="*{status?.name() == 'PENDING'}" class="badge bg-warning text-dark" th:text="*{status}"></span>
                        <span th:if="*{status?.name() == 'APPROVED'}" class="badge bg-success" th:text="*{status}"></span>
                        <span th:if="*{status?.name() == 'DENIED'}" class="badge bg-danger" th:text="*{status}"></span>
                    </div>
                    <div class="card-body">
                        <dl class="row mb-0">
                            <dt class="col-sm-5 text-muted small">Event</dt>
                            <dd class="col-sm-7 fw-bold" th:text="*{seating?.event?.name}"></dd>

                            <dt class="col-sm-5 text-muted small">Seating Date &amp; Time</dt>
                            <dd class="col-sm-7">
                              <span class="badge bg-light text-dark border"
                                    th:if="${reservation.seating != null}"
                                    th:text="${#temporals.format(reservation.seating.startDateTime, 'MMM dd, yyyy h:mm a')}"></span>
                            </dd>

                            <dt class="col-sm-5 text-muted small">First Name</dt>
                            <dd class="col-sm-7" th:text="*{firstName}"></dd>

                            <dt class="col-sm-5 text-muted small">Last Name</dt>
                            <dd class="col-sm-7" th:text="*{lastName}"></dd>

                            <dt class="col-sm-5 text-muted small">Group Size</dt>
                            <dd class="col-sm-7" th:text="*{groupSize}"></dd>
                        </dl>
                    </div>
                </div>
                <div class="alert alert-info mt-3">
                    <strong>Your tracking code:</strong>
                    <span class="font-monospace" th:text="${reservation.uuid}"></span>
                    <br/>
                    <small>Save this code to check your reservation status later.</small>
                </div>

            </div>
        </div>
    </main>
</div>
</body>
</html>
