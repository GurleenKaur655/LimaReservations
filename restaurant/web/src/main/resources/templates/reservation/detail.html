<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{partial :: bootstrap}"/>
    <meta charset="UTF-8">
    <title>Reservation Details</title>
</head>
<body>
<header>
    <nav th:replace="~{nav :: navbar}"></nav>
</header>
<div class="container mt-4">
    <main role="main" class="pb-3">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="mb-0" style="font-size: 1.8rem; font-weight: 700; color: #1a1a1a;">Reservation Details</h4>
                    <a th:href="@{/reservation/manage}" class="btn btn-outline-secondary btn-sm">← Back</a>
                </div>

                <div class="alert alert-danger" th:if="${actionError != null}" th:text="${actionError}"></div>

                <!-- Event Details -->
                <div class="mb-3" th:object="${event}">
                    <th:block th:replace="~{event/fragments :: details}"/>
                </div>

                <!-- Seating Details -->
                <div class="card shadow-sm mb-3">
                    <div class="card-header bg-light">
                        <h5 class="mb-0" style="font-family: 'Iosevka Charon Mono', monospace; font-weight: 800; color: #6B7C3A;">Seating Details</h5>
                    </div>
                    <div class="card-body">
                        <dl class="row mb-0">
                            <dt class="col-sm-4 text-muted small">Date &amp; Time</dt>
                            <dd class="col-sm-8">
                                <span class="badge bg-light text-dark border"
                                      th:text="${#temporals.format(reservation.seating.startDateTime, 'MMM dd, yyyy h:mm a')}"></span>
                            </dd>
                            <dt class="col-sm-4 text-muted small">Duration</dt>
                            <dd class="col-sm-8" th:text="${reservation.seating.durationMinutes} + ' min'"></dd>
                        </dl>
                    </div>
                </div>

                <!-- Reservation Details -->
                <div class="mb-3" th:object="${reservation}">
                    <th:block th:replace="~{reservation/fragments :: details}"/>
                </div>

                <!-- Manage Card -->
                <div class="card shadow-sm mt-3">
                    <div class="card-header bg-light">
                        <h5 class="mb-0" style="font-family: 'Iosevka Charon Mono', monospace; font-weight: 800; color: #6B7C3A;">
                            Manage Reservation
                        </h5>
                    </div>
                    <div class="card-body">

                        <!-- Already approved -->
                        <div th:if="${reservation.status?.name() == 'APPROVED'}">
                            <p class="text-success fw-bold mb-1">✅ This reservation is approved and cannot be modified.</p>
                            <p class="text-muted small mb-0" th:if="${reservation.tableId != null}">
                                Assigned Table ID: <strong th:text="${reservation.tableId}"></strong>
                            </p>
                        </div>

                        <div th:unless="${reservation.status?.name() == 'APPROVED'}">

                            <form th:action="@{/reservation/manage/{id}/approve(id=${reservation.id})}"
                                  method="post" id="approveForm">

                                <label class="form-label fw-bold small text-muted">Assign Table</label>

                                <!-- Search box -->
                                <input type="text"
                                       id="tableSearch"
                                       class="form-control form-control-sm mb-2"
                                       placeholder="Search tables..."
                                       autocomplete="off"
                                       oninput="filterTables(this.value)"/>

                                <!-- Radio card list -->
                                <div id="tableList"
                                     style="max-height: 240px; overflow-y: auto; border: 1px solid #dee2e6; border-radius: 8px; padding: 6px;">

                                    <div th:each="t : ${reservation.seating.tables}"
                                         class="table-option"
                                         th:attr="data-name=${t.name}">
                                        <label style="display: flex; align-items: center; gap: 10px;
                                                       padding: 10px 12px; border-radius: 6px; cursor: pointer;
                                                       border: 1px solid transparent; transition: background 0.15s;"
                                               class="table-label w-100 mb-1"
                                               onmouseover="this.style.background='#f8f9fa'"
                                               onmouseout="if(!this.querySelector('input').checked) this.style.background=''">
                                            <input type="radio"
                                                   name="tableId"
                                                   th:value="${t.id}"
                                                   required
                                                   onchange="highlightSelected(this)"/>
                                            <span>
                                                <span class="fw-semibold" th:text="${t.name}"></span>
                                                <span class="text-muted small ms-2"
                                                      th:text="'Capacity: ' + ${t.capacity}"></span>
                                            </span>
                                        </label>
                                    </div>


                                    <div id="noResults"
                                         style="display:none; padding: 12px; text-align:center; color:#6c757d; font-size:13px;">
                                        No tables match your search.
                                    </div>
                                </div>

                                <small class="text-muted d-block mt-1 mb-3">Select the table to assign to this reservation</small>

                                <button type="submit" class="btn btn-success btn-sm w-100">✅ Approve</button>
                            </form>

                            <!-- Deny form -->
                            <form th:action="@{/reservation/manage/{id}/deny(id=${reservation.id})}"
                                  method="post" class="mt-2">
                                <button type="submit" class="btn btn-danger btn-sm w-100">❌ Deny</button>
                            </form>

                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>
</div>

<script>
    function filterTables(query) {
        var options = document.querySelectorAll('.table-option');
        var q = query.toLowerCase().trim();
        var visible = 0;
        options.forEach(function(opt) {
            var name = opt.getAttribute('data-name').toLowerCase();
            if (name.includes(q)) {
                opt.style.display = '';
                visible++;
            } else {
                opt.style.display = 'none';
            }
        });
        document.getElementById('noResults').style.display = visible === 0 ? 'block' : 'none';
    }

    function highlightSelected(radio) {
        document.querySelectorAll('.table-label').forEach(function(lbl) {
            lbl.style.background = '';
            lbl.style.border = '1px solid transparent';
        });
        var selectedLabel = radio.closest('label');
        selectedLabel.style.background = '#d1e7dd';
        selectedLabel.style.border = '1px solid #a3cfbb';
    }
</script>
</body>
</html>
