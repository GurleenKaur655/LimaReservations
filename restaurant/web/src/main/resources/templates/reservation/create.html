<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{partial :: bootstrap}"/>
    <meta charset="UTF-8">
    <title>Request Reservation</title>
</head>
<body>
<header>
    <nav th:replace="~{nav :: navbar}"></nav>
</header>
<div class="container mt-4">
    <main role="main" class="pb-3">
        <div class="row justify-content-center">
            <div class="col-md-8">

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="mb-0" style="font-size: 1.8rem; font-weight: 700; color: #1a1a1a;">Request Reservation</h4>
                    <a th:href="@{/reservation/index}" class="btn btn-outline-secondary btn-sm">← Back</a>
                </div>

                <!-- Event Details -->
                <div class="mb-3" th:object="${event}">
                    <th:block th:replace="~{event/fragments :: details}"/>
                </div>

                <!-- Seating Details -->
                <div class="card shadow-sm mb-3" th:object="${seating}">
                    <div class="card-header bg-light">
                        <h5 class="mb-0" style="font-family: 'Iosevka Charon Mono', monospace; font-weight: 800; color: #6B7C3A;">Seating Details</h5>
                    </div>
                    <div class="card-body">
                        <dl class="row mb-0">
                            <dt class="col-sm-4 text-muted small">Date &amp; Time</dt>
                            <dd class="col-sm-8">
                               <span class="badge bg-light text-dark border"
                                     th:text="*{#temporals.format(startDateTime, 'MMM dd, yyyy h:mm a')}"></span>
                            </dd>

                            <dt class="col-sm-4 text-muted small">Duration</dt>
                            <dd class="col-sm-8" th:text="*{durationMinutes} + ' min'"></dd>

                            <dt class="col-sm-4 text-muted small">Capacity</dt>
                            <dd class="col-sm-8" th:text="*{table != null ? table.capacity : 'N/A'}"></dd>
                        </dl>
                    </div>
                </div>

                <!-- Reservation Form -->
                <form th:action="@{/reservation/create/{id}(id=${seating.id})}"
                      method="post"
                      th:object="${reservation}">
                    <div th:replace="~{reservation/fragments :: input}"></div>
                    <div class="mt-3">
                        <input type="submit" value="Request Reservation" class="btn btn-success w-100"/>
                    </div>
                </form>

            </div>
        </div>
    </main>
</div>
</body>
</html>
