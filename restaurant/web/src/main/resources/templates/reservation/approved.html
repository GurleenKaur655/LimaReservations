<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <th:block th:replace="~{partial :: bootstrap}"/>
    <title>Approved Reservations</title>
</head>
<body>
<header>
    <nav th:replace="~{nav :: navbar}"></nav>
</header>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0" style="font-size: 1.8rem; font-weight: 700; color: #1a1a1a;">
            Approved Reservations — <span th:text="${event.name}"></span>
        </h4>
        <a th:href="@{/event/{id}(id=${event.id})}" class="btn btn-outline-secondary btn-sm">← Back to Event</a>
    </div>

    <div th:if="${reservations == null or #lists.isEmpty(reservations)}">
        <div class="alert alert-info">No approved reservations for this event.</div>
    </div>

    <div th:unless="${reservations == null or #lists.isEmpty(reservations)}">
        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-striped mb-0">
                        <thead class="table-dark">
                        <tr>
                            <th>Seating Time</th>
                            <th>Guest Name</th>
                            <th>Group Size</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="r : ${reservations}" class="align-middle">
                            <td>
                                <span th:if="${r.seating != null}"
                                      th:text="${#temporals.format(r.seating.startDateTime, 'MMM dd, yyyy - hh:mm a')}">
                                </span>
                                <span th:unless="${r.seating != null}" class="text-muted">N/A</span>
                            </td>
                            <td th:text="${r.firstName + ' ' + r.lastName}"></td>
                            <td th:text="${r.groupSize}"></td>
                            <td>
                                <a th:href="@{/reservation/manage/{id}(id=${r.id})}"
                                   class="btn btn-outline-dark btn-sm">🔍 View Details</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
