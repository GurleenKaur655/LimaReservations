<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <th:block th:replace="~{partial :: bootstrap}"/>
    <title>Login</title>
</head>
<body>
<header>
    <nav th:replace="~{nav :: navbar}"></nav>
</header>
<div class="container mt-4">
    <main role="main" class="pb-3">
        <div class="row justify-content-center">
            <div class="col-md-5">

                <div class="d-flex justify-content-center align-items-center mb-3">
                    <h4 class="mb-0" style="font-size: 1.8rem; font-weight: 700; color: #1a1a1a;">Login</h4>
                </div>

                <div class="card shadow-sm">
                    <div class="card-header bg-light">
                        <h5 class="mb-0" style="font-family: 'Iosevka Charon Mono', monospace; font-weight: 800; color: #6B7C3A; letter-spacing: 0.5px;">Welcome Back</h5>
                    </div>
                    <div class="card-body">

                        <div th:if="${param.error}" class="alert alert-danger">
                            ⚠️ Invalid username or password.
                        </div>

                        <form th:action="@{/login}" method="post">

                            <div class="mb-3">
                                <label class="form-label fw-bold small text-muted">Username</label>
                                <input type="text" name="username" th:value="${param.username}"
                                       class="form-control" placeholder="Enter username" required/>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold small text-muted">Password</label>
                                <input type="password" name="password"
                                       class="form-control" placeholder="Enter password" required/>
                            </div>

                            <div class="mt-3">
                                <input type="submit" value="Login" class="btn btn-success w-100"/>
                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </main>
</div>
</body>
</html>
