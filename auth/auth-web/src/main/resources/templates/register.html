<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <th:block th:replace="~{partial :: bootstrap}"/>
</head>
<body>
<header>
    <nav th:replace="~{nav :: navbar}"></nav>
</header>
<div class="container mt-4">
    <main role="main" class="pb-3">
        <div class="row justify-content-center">
            <div class="col-md-5">

                <div class="d-flex justify-content-center align-items-center mb-3">
                    <h4 class="mb-0" style="font-size: 1.8rem; font-weight: 700; color: #1a1a1a;">Register</h4>
                </div>

                <div class="card shadow-sm">
                    <div class="card-header bg-light">
                        <h5 class="mb-0" style="font-family: 'Iosevka Charon Mono', monospace; font-weight: 800; color: #6B7C3A; letter-spacing: 0.5px;">Create Account</h5>
                    </div>
                    <div class="card-body">

                        <div th:unless="${message == null}" class="alert alert-warning">
                            ⚠️ <span th:text="${message}"></span>
                        </div>

                        <!--/*@thymesVar id="user" type="nbcc.auth.domain.UserRegistration"*/-->
                        <form method="post" th:action="@{/register}" th:object="${user}">

                            <div class="mb-3">
                                <label class="form-label fw-bold small text-muted">Username</label>
                                <input th:field="*{username}" class="form-control" placeholder="Enter username"/>
                                <div class="text-danger small mt-1" th:errors="*{username}"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold small text-muted">Email</label>
                                <input th:field="*{email}" class="form-control" placeholder="Enter email"/>
                                <div class="text-danger small mt-1" th:errors="*{email}"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold small text-muted">Password</label>
                                <input th:field="*{password}" type="password" class="form-control" placeholder="Enter password"/>
                                <div class="text-danger small mt-1" th:errors="*{password}"></div>
                            </div>

                            <div class="mt-3">
                                <input type="submit" value="Register" class="btn btn-success w-100"/>
                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </main>
</div>
</body>
</html>
